# Dependabot: monthly, grouped update PRs. CI must pass before merging.
version: 2
updates:
  - package-ecosystem: npm # also handles pnpm-lock.yaml
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Los_Angeles
    # Wait a few days after a release before proposing it (supply-chain safety).
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*", "pagefind", "@pagefind/*"]
        update-types: [minor, patch]
      lint-format:
        patterns:
          [
            "eslint*",
            "@eslint/*",
            "typescript-eslint",
            "prettier*",
            "typescript",
          ]
        update-types: [minor, patch]
      everything-else:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Los_Angeles
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
