name: CI

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v5

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "📝 Checking code format"
        run: pnpm run format:check

      - name: "🚀 Build the project"
        run: pnpm run build

  resume:
    name: Resume builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v5

      - name: "📄 Setup Typst"
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.13.1"

      - name: "📄 Build resume PDF"
        run: typst compile --ignore-system-fonts --font-path resume/fonts resume/resume.typ resume.pdf

      - name: "📏 Resume stays within 2 pages"
        run: |
          pages=$(typst query --ignore-system-fonts --font-path resume/fonts resume/resume.typ "<page-count>" --field value --one)
          echo "Resume PDF has $pages page(s)"
          if [ "$pages" -gt 2 ]; then echo "::error::Resume PDF is $pages pages (limit 2)"; exit 1; fi
